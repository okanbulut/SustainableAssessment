<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project partners map</title>
<link rel="stylesheet" href="assets/ds/styles.css">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; background: var(--color-bg); font-family: var(--font-body); color: var(--color-text); }
  #wrap { padding: 2px; }
  #maptitle { font-family: var(--font-heading); font-size: 22px; line-height: 1.15; margin: 0 0 4px; }
  #mapsub { font-size: 14px; color: var(--color-neutral-700); margin: 0 0 14px; }
  #mapbox { position: relative; }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
  .dotmark { width: 9px; height: 9px; border-radius: 999px; flex: none; margin-top: 5px; }
  .node { cursor: pointer; }
  #tip { position: absolute; pointer-events: none; opacity: 0; transition: opacity 120ms; background: var(--color-neutral-900); color: var(--color-neutral-100); padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.35; box-shadow: var(--shadow-md); max-width: 220px; transform: translate(-50%, -128%); }
  #tip b { display: block; font-size: 14px; }
  #legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--color-neutral-700); margin-top: 10px; }
  #legend span { display: flex; gap: 7px; align-items: center; }
</style>
</head>
<body>
<div id="wrap">
  <h2 id="maptitle">Our partner institutions</h2>
  <p id="mapsub">Hover a marker to see the institution and the team member based there.</p>
  <div id="mapbox"><div id="tip"></div></div>
</div>
<script>
const LEAD = "#c67139", PARTNER = "#c67139", EXT = "#7a8a5e";
const sites = [
  { n: "Okan Bulut", i: "University of Alberta", c: "Canada", lon: -113.5, lat: 53.53, role: "lead" },
  { n: "Andrea Barrett", i: "University of Rochester", c: "United States", lon: -77.61, lat: 43.16, role: "partner" },
  { n: "Judith Kleine Staarman", i: "University of Exeter", c: "United Kingdom", lon: -3.53, lat: 50.72, role: "partner" },
  { n: "Fred Kofi Boateng", i: "University of Ghana", c: "Ghana", lon: -0.19, lat: 5.65, role: "partner" },
  { n: "Ryan Nefdt", i: "University of Cape Town", c: "South Africa", lon: 18.42, lat: -33.96, role: "partner" },
  { n: "Alex Okello", i: "Makerere University", c: "Uganda", lon: 32.57, lat: 0.33, role: "partner" },
  { n: "Timothy Teo", i: "Chinese University of Hong Kong", c: "Hong Kong", lon: 114.21, lat: 22.42, role: "partner" },
  { n: "Petch Sajjacholapunt", i: "Mahidol University", c: "Thailand", lon: 100.32, lat: 13.79, role: "partner" },
  { n: "Stephen Woodcock", i: "University of Technology Sydney", c: "Australia", lon: 151.2, lat: -33.88, role: "partner" },
  { n: "Gavin Brown", i: "University of Auckland", c: "New Zealand", lon: 174.77, lat: -36.85, role: "partner" },
  { n: "Marlit Annalena Lindner", i: "Leibniz Institute for Science and Mathematics Education", c: "Germany", lon: 10.13, lat: 54.32, role: "external" },
  { n: "Lisa Kim", i: "University of Sydney", c: "Australia", lon: 151.19, lat: -33.89, role: "external" }
];
const color = s => s.role === "external" ? EXT : (s.role === "lead" ? LEAD : PARTNER);

const W = 900, H = 470;
const svg = d3.select("#mapbox").append("svg").attr("viewBox", [0, 0, W, H]);
const proj = d3.geoNaturalEarth1().fitExtent([[6, 6], [W - 6, H - 6]], { type: "Sphere" });
const path = d3.geoPath(proj);
const tip = d3.select("#tip");

svg.append("path").attr("d", path({ type: "Sphere" })).attr("fill", "#efe1cb");
svg.append("path").attr("d", d3.geoPath(proj)(d3.geoGraticule10())).attr("fill", "none").attr("stroke", "#e2d0b4").attr("stroke-width", 0.6);

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topo => {
  const countries = topojson.feature(topo, topo.objects.countries);
  svg.insert("g", ":first-child + *").selectAll("path").data(countries.features).join("path")
    .attr("d", path).attr("fill", "#ded0b8").attr("stroke", "#f5ead8").attr("stroke-width", 0.7);
  drawNodes();
});

// nudge apart the two Sydney sites
const placed = sites.map(s => { const p = proj([s.lon, s.lat]); return { s, x: p[0], y: p[1] }; });
placed.forEach((a, i) => placed.forEach((b, j) => {
  if (j <= i) return;
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  if (d < 11) { const k = (11 - d) / 2 || 5.5; a.x -= k; a.y += k * 0.4; b.x += k; b.y -= k * 0.4; }
}));

function drawNodes() {
  const g = svg.append("g");
  const node = g.selectAll("g").data(placed).join("g")
    .attr("class", "node")
    .attr("transform", d => `translate(${d.x},${d.y})`)
    .on("mouseenter", (ev, d) => hover(d, true))
    .on("mouseleave", (ev, d) => hover(d, false));

  node.append("circle").attr("r", d => d.s.role === "lead" ? 16 : 12)
    .attr("fill", d => color(d.s)).attr("opacity", 0.16);
  node.append("circle").attr("class", "core")
    .attr("r", d => d.s.role === "lead" ? 7 : 5)
    .attr("fill", d => color(d.s)).attr("stroke", "#f5ead8").attr("stroke-width", 1.6);
  node.filter(d => d.s.role === "lead").append("circle")
    .attr("r", 13).attr("fill", "none").attr("stroke", LEAD).attr("stroke-width", 1.4).attr("opacity", 0.55);
}

function hover(d, on) {
  svg.selectAll(".node").filter(x => x === d).select(".core")
    .transition().duration(120).attr("r", on ? (d.s.role === "lead" ? 9.5 : 7.5) : (d.s.role === "lead" ? 7 : 5));
  const box = document.getElementById("mapbox").getBoundingClientRect();
  const scale = box.width / W;
  tip.style("opacity", on ? 1 : 0)
    .style("left", d.x * scale + "px")
    .style("top", d.y * scale + "px")
    .html(`<b>${d.s.i}</b>${d.s.n}<br>${d.s.c}${d.s.role === "lead" ? " · project lead" : d.s.role === "external" ? " · external partner" : ""}`);
}

d3.select("#wrap").append("div").attr("id", "legend").html(
  `<span><span class="dotmark" style="background:${PARTNER}"></span>WUN partner institution</span>` +
  `<span><span class="dotmark" style="background:${EXT}"></span>External partner</span>` +
  `<span><span class="dotmark" style="background:transparent;border:1.5px solid ${LEAD}"></span>Project lead</span>`);

function report() {
  const h = Math.ceil(document.body.scrollHeight);
  parent.postMessage({ type: "partnerMapHeight", height: h }, "*");
}
new ResizeObserver(report).observe(document.body);
window.addEventListener("load", report);
report();
</script>
</body>
</html>
